name: Daily Yahoo Finance Wayback Fetch

on:
  schedule:
    # Run separately from the regular Yahoo fetch workflow (08:30 Taipei).
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      specific_symbols:
        description: "Optional comma-separated stock codes; leave blank to fetch all stocks"
        required: false
        default: ""
        type: string
      max_runtime_minutes:
        description: "Maximum fetch runtime in minutes"
        required: false
        default: "300"
        type: string
      backfill:
        description: "Use deeper historical lookback"
        required: false
        default: false
        type: boolean

concurrency:
  group: yahoo-finance-serial
  cancel-in-progress: false
  queue: max

jobs:
  wayback:
    runs-on:
      group: ZhongZheng782
      labels: [self-hosted, Linux, X64, gpu]
    permissions:
      contents: write
      actions: read
    env:
      SYNC_PAT_BIZTRENDS: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
      WAYBACK_CDP_URL: "http://192.168.31.101:9222"
      WAYBACK_SYMBOLS: ${{ github.event.inputs.specific_symbols || '' }}
      WAYBACK_MAX_RUNTIME: ${{ github.event.inputs.max_runtime_minutes || '300' }}
      WAYBACK_BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture Wayback attempt baseline
        id: wayback_baseline
        run: |
          file="data/reports/raw_wayback_fetch_attempts.csv"
          if [ -f "$file" ]; then
            rows=$(($(wc -l < "$file") - 1))
          else
            rows=0
          fi
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

      - name: Fetch Wayback Machine consensus
        id: wayback_fetch
        run: |
          args=(--max-runtime-minutes "$WAYBACK_MAX_RUNTIME")
          if [ -n "$WAYBACK_SYMBOLS" ]; then
            args+=(--specific-symbols "$WAYBACK_SYMBOLS")
          fi
          if [ "$WAYBACK_BACKFILL" = "true" ]; then
            args+=(--backfill)
          fi
          python skills/skill-yahoo-finance-fetch/scripts/fetch_wayback_consensus.py "${args[@]}"
        continue-on-error: true

      - name: Record scheduled Wayback run
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_FILE: Actions-fetch-wayback.yaml
          WAYBACK_FETCH_OUTCOME: ${{ steps.wayback_fetch.outcome }}
        run: |
          python scripts/record_wayback_run.py \
            --fetch-outcome "$WAYBACK_FETCH_OUTCOME" \
            --attempt-start-line "${{ steps.wayback_baseline.outputs.rows || '0' }}"
        continue-on-error: true

      - name: Generate Wayback coverage matrix
        if: always()
        run: python scripts/gen_wayback_coverage_matrix.py
        continue-on-error: true

      - name: Configure git author
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push Wayback progress
        if: always()
        run: |
          for file in \
            data/reports/raw_wayback_yahoo_finance_consensus.csv \
            data/reports/raw_wayback_fetch_attempts.csv \
            data/reports/raw_wayback_cdx_queries.csv \
            data/reports/raw_wayback_cdx_candidates.csv \
            data/reports/raw_wayback_run_history.csv \
            data/reports/raw_yahoo_finance_consensus_history.csv \
            data/reports/raw_wayback_coverage_matrix.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --staged --quiet; then
            echo "No Wayback progress to commit"
          else
            git commit -m "chore: update Yahoo Finance Wayback progress ($(date -u +%Y-%m-%d))"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                echo "Pushed Wayback progress on attempt $attempt"
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              git rebase --abort >/dev/null 2>&1 || true
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push Wayback progress after 3 attempts"
              exit 1
            fi
          fi

      - name: Sync Yahoo data to biztrends.TW
        if: env.SYNC_PAT_BIZTRENDS != ''
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ env.SYNC_PAT_BIZTRENDS }}
          CONFIG_PATH: .github/sync-to-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true

      - name: Sync skip notice
        if: env.SYNC_PAT_BIZTRENDS == ''
        run: echo "::warning::REPO_FILE_SYNC_WENCHIEHLEE_MONEY is not configured; skipping biztrends.TW sync."

      - name: Mark Wayback fetch failure
        if: always() && steps.wayback_fetch.outcome != 'success'
        run: |
          echo "## Wayback fetch failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The standalone Wayback fetch step did not complete successfully. Check the CDX diagnostics CSV and step logs." >> "$GITHUB_STEP_SUMMARY"
          exit 1
