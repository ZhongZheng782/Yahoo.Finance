name: Daily Yahoo Finance Fetch

on:
  schedule:
    - cron: "30 19 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      market:
        description: "Market to fetch"
        required: false
        default: "all"
        type: choice
        options: [all, tw, us]
      tw_list:
        description: "Taiwan list to use"
        required: false
        default: "all"
        type: choice
        options: [all, focus]
      specific_symbols:
        description: "Optional comma-separated symbols, e.g. 2330,2454,NVDA"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SYNC_PAT_BIZTRENDS: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Taiwan stock lists
        run: python Get觀察名單.py

      - name: Validate synced inputs
        run: |
          if [ ! -f data/ConceptStocks/raw_conceptstock_company_metadata.csv ]; then
            echo "::warning::ConceptStocks metadata missing; US fetch will be empty"
          fi
          if [ ! -f data/reports/raw_factset_detailed_report.csv ]; then
            echo "::warning::FactSet report missing; summary cross-check will be missing_factset_source"
          fi

      - name: Fetch Yahoo Finance analysis
        run: |
          MARKET="${{ github.event.inputs.market || 'all' }}"
          TW_LIST="${{ github.event.inputs.tw_list || 'all' }}"
          SYMBOLS="${{ github.event.inputs.specific_symbols || '' }}"
          RAW_OUTPUT="data/reports/raw_yahoo_finance.csv"
          echo "RAW_OUTPUT=$RAW_OUTPUT" >> "$GITHUB_ENV"
          python skills/skill-yahoo-finance-fetch/scripts/fetch_cli.py \
            --market "$MARKET" \
            --tw-list "$TW_LIST" \
            --specific-symbols "$SYMBOLS" \
            --output-csv "$RAW_OUTPUT"

      - name: Generate forecast summary
        run: |
          SUMMARY_OUTPUT="data/reports/raw_yahoo_finance_summary_latest.csv"
          python process_group/process_cli.py --raw-csv "$RAW_OUTPUT" --output-csv "$SUMMARY_OUTPUT"

      - name: Append consensus history (逐日累積，前瞻EPS訊號未來回測用)
        run: python process_group/append_consensus_history.py
        continue-on-error: true

      - name: Fetch 2y daily price history (TW + US)
        run: |
          python skills/skill-yahoo-finance-fetch/scripts/fetch_daily_price.py \
            --output-csv data/reports/raw_yahoo_finance_daily_price.csv
        continue-on-error: true

      - name: Fetch 60-minute intraday price history (TW only)
        run: |
          python skills/skill-yahoo-finance-fetch/scripts/fetch_intraday_60m.py \
            --output-csv data/reports/raw_yahoo_finance_intraday_60m.csv
        continue-on-error: true

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit base Yahoo reports
        run: |
          git add StockID_TWSE_TPEX.csv StockID_TWSE_TPEX_focus.csv
          git add data/reports/raw_yahoo_finance.csv
          git add data/reports/raw_yahoo_finance_summary_latest.csv
          git add data/reports/raw_wayback_coverage_matrix.csv
          git add data/reports/raw_yahoo_finance_daily_price.csv
          git add data/reports/raw_yahoo_finance_consensus_daily.csv
          git add data/reports/raw_yahoo_finance_consensus_history.csv
          git add data/reports/raw_yahoo_finance_intraday_60m.csv
          if git diff --staged --quiet; then
            echo "No base Yahoo report changes to commit"
          else
            git commit -m "chore: update Yahoo Finance forecasts ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Fetch Wayback Machine consensus (daily)
        run: |
          python skills/skill-yahoo-finance-fetch/scripts/fetch_wayback_consensus.py --max-runtime-minutes 300
        continue-on-error: true

      - name: Commit Wayback progress
        run: |
          if [ -f data/reports/raw_wayback_yahoo_finance_consensus.csv ]; then
            git add data/reports/raw_wayback_yahoo_finance_consensus.csv
          fi
          if [ -f data/reports/raw_wayback_coverage_matrix.csv ]; then
            git add data/reports/raw_wayback_coverage_matrix.csv
          fi
          if [ -f data/reports/raw_yahoo_finance_consensus_history.csv ]; then
            git add data/reports/raw_yahoo_finance_consensus_history.csv
          fi
          if git diff --staged --quiet; then
            echo "No Wayback progress to commit"
          else
            git commit -m "chore: update Yahoo Finance Wayback progress ($(date -u +%Y-%m-%d))"
            # This step used to hard-fail (and skip every downstream sync step) on the
            # first rebase conflict against a concurrent push. Retry with --autostash so
            # a single transient race doesn't throw away up to 5 hours of Wayback progress.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                echo "Pushed Wayback progress on attempt $attempt"
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              git rebase --abort >/dev/null 2>&1 || true
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push Wayback progress after 3 attempts"
              exit 1
            fi
          fi

      - name: Sync Yahoo data to biztrends.TW
        if: env.SYNC_PAT_BIZTRENDS != ''
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ env.SYNC_PAT_BIZTRENDS }}
          CONFIG_PATH: .github/sync-to-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true

      - name: Sync skip notice
        if: env.SYNC_PAT_BIZTRENDS == ''
        run: echo "::warning::REPO_FILE_SYNC_WENCHIEHLEE_MONEY is not configured; skipping biztrends.TW sync."
