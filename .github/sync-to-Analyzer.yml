# .github/sync-to-Analyzer.yml
group:
  - files:
      - source: data/reports/raw_yahoo_finance.csv
        dest:   data/stage1_raw/raw_yahoo_finance.csv
      - source: data/reports/raw_yahoo_finance_summary_latest.csv
        dest:   data/stage1_raw/raw_yahoo_finance_summary_latest.csv
      - source: data/reports/raw_wayback_yahoo_finance_consensus.csv
        dest:   data/stage1_raw/raw_wayback_yahoo_finance_consensus.csv
      - source: data/reports/raw_wayback_coverage_matrix.csv
        dest:   data/stage1_raw/raw_wayback_coverage_matrix.csv
      - source: raw_column_definition_YahooFinance.md
        dest:   definitions/raw_column_definition_YahooFinance.md
    repos: |
      wenchiehlee-investment/Python-Actions.GoodInfo.Analyzer
